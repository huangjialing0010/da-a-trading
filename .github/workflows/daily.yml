name: 大A日更

on:
  schedule:
    # 北京时间 17:30 = UTC 09:30, 周一至周五
    - cron: "30 9 * * 1-5"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许 git push 回仓库

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install akshare pandas numpy pyyaml

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: market-data-${{ github.run_date }}
          restore-keys: |
            market-data-

      - name: Run daily update
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python -c "
          import socket
          socket.setdefaulttimeout(15)
          from tools.auto_trader import daily_update
          print(daily_update())
          "

      - name: Commit and push
        run: |
          git config user.name "大A Bot"
          git config user.email "bot@da-a.local"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 日更 $(date +%Y-%m-%d)"
            git push
          fi
