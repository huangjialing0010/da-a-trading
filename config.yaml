# 大A 虚拟盘交易系统 — 策略参数配置
# 修改阈值后无需改代码，重新运行 screener / monitor 即可生效
#
# 回测结论（2026-07-24更新，全300池+营收过滤）：
#
#   【深价策略】
#   区间 2019-2026 | 300只全沪深300 | 策略+46.4% vs 基准+60.1%
#   胜率34.2%(27/79) | 盈亏比2.58 | 最大回撤-35.3% | 256笔交易
#   营收同比<0硬淘汰为关键过滤——不加此条策略-21.3%，加入后+46.4%，单条过滤贡献67pp
#   策略在熊市年(21/22/23)系统性跑赢基准，牛市年(19/20/24)跑输——深度价值固有特征
#   2019零交易（牛市无标的）、2020亏-21%为COVID黑天鹅（报告延迟，硬止损有效）
#   策略不替代人工深度分析——机械版本无法识别"可逆性"，只测规则不测判断
#
#   【趋势反转策略】
#   区间 2019-2026 | 70只 | 策略+79.0% vs 基准+65.9% | 超额+13.1%
#   胜率43.5%(30/69) | 盈亏比2:0 | 最大回撤-45.8% | 209笔交易
#   负债率不过滤（回测证实高负债重资产公司是趋势改善的主要来源，过滤则超额转负）
#   每年有交易，不依赖极端恐慌。但-46%回撤是真实风险，有生存偏差
#   质量过滤：ROE>6% + 利润YoY三连改善(≥2pp) + 8Q均值>80% + 不追52W高点 + cur_yoy>-20%

# === 账户 ===
account:
  initial_cash: 1000000         # 初始资金（100万）
  single_stock_max_pct: 0.20    # 单票仓位上限
  max_total_position_pct: 0.80  # 总仓位上限（极端行情）
  normal_total_position_pct: 0.50  # 正常总仓位上限

# === 交易成本模型（2026-08-04 起生效，历史交易不追溯；仅自动日更账户启用） ===
costs:
  commission_rate: 0.00025   # 佣金万2.5（买卖双向）
  min_commission: 5.0        # 单笔最低佣金（元）
  stamp_tax: 0.0005          # 印花税（仅卖出，0.05%）
  slippage: 0.001            # 滑点（买入加价、卖出减价）
  limit_day_skip: true       # 一字板近似：开=高=低且方向不利时跳过成交

# === 深度价值策略（主力） ===
deep_value:
  min_market_cap: 50            # 最低市值（亿），筛掉壳股庄股
  min_deducted_roe: 0.06        # 扣非ROE最低（3年平均）
  min_cashflow_ratio: 0.8       # 经营现金流/净利润最低
  max_interest_debt_ratio: 0.30 # 有息负债率上限
  max_goodwill_ratio: 0.30      # 商誉/净资产上限
  max_pledge_ratio: 0.50        # 大股东质押率上限
  min_drawdown_52w: 0.40        # 距52周高点最小跌幅
  universe_top_n: 300             # 扫描全沪深300（回测2019-2026：策略+46.4% vs 基准+60.1%，超额-13.7pp，256笔交易，盈亏比2.58）
  trend_price_percentile: 0.30   # 趋势反转策略：价格处在1年最低N%区间时触发初选（0.30=最低30%）
  volume_shrink_days: 5         # 成交量萎缩连续天数
  volume_shrink_ratio: 0.50     # 成交量/20日均量上限
  pe_percentile_max: 0.20       # PE近5年分位上限（最低20%区间）
  commodity_cycle_check: true     # 商品周期检测：对有色/钢铁/煤炭/石油公司检测商品价格分位
  min_revenue_yoy: 0.0            # 营收同比最低（硬淘汰，<0淘汰。回测验证：此单条过滤贡献67pp超额改善）

  # 分批建仓
  batch_entry:
    - ratio: 0.30               # 第一批：到目标区间买30%
      drop: 0.00
    - ratio: 0.30               # 第二批：再跌10%加
      drop: 0.10
    - ratio: 0.40               # 第三批：企稳确认后加
      drop: 0.00

  hold_min_months: 6            # 最短持有期（月）
  hold_max_months: 18           # 最长持有期（月）

# === 极端恐慌策略 ===
panic:
  trigger_below_nav_pct: 0.12   # 全市场破净率触发阈值
  trigger_erp: 0.07             # 沪深300 ERP触发阈值
  etf_list:
    - "510300"                  # 沪深300ETF
    - "510500"                  # 中证500ETF
  batches: 5                    # 分5批买入
  batch_drop: 0.05              # 每跌5%加一批
  exit_erp: 0.04                # ERP回到4%以下退出

# === 止损规则 ===
stops:
  hard_stop: -0.20              # 硬止损：-20%（回测2020年华东医药触发，有效截断亏损；胜率17.6%下盈亏比10:1，靠少数大赢家覆盖多数小亏）
  time_stop_months: 2           # 时间止损：持仓2个月无利润
  time_stop_cut_ratio: 0.50     # 时间止损砍仓比例
  fundamental_stop_revenue: -0.20  # 基本面止损：营收同比降20%
  fundamental_stop_profit: -0.20   # 基本面止损：利润同比降20%

# === 止盈规则 ===
take_profit:
  trail_trigger: 0.25           # 涨25%后启动移动止盈（回测3只移动止盈均获利：天山铝业+60k/华东+119k/东山+30k）
  trail_drawdown: 0.12          # 最高点回撤12%离场（回测2020年有效锁定利润，TCL触发12.7%回撤离场）

# === 行业过滤（选股前自动筛选行业逻辑） ===
industry_filter:
  enabled: true
  # 加分名单已移除（2026-07-24）：和黑名单同一逻辑——主观判断不应左右系统评分。
  # 保留空列表以保持向后兼容。
  structural_support_kw: []
  # 黑名单已移除（2026-07-24）：全凭主观判断无数据支撑。
  # 风控交给财务过滤（ROE/现金流/利润）+ 硬止损 + MA200 退出 + 行业集中度（单申万二级≤2只）。
  # 保留空列表以保持向后兼容。
  structural_decline_codes: []

# === 行业分析（申万二级分类 + 一级行业量化评分） ===
# 注：行业健康评分仍用31个一级行业的PE/指数数据（二级缺乏PE数据）
# 但选股后的集中度限制按二级分类（131类），更精细地区分业务差异
industry_analysis:
  enabled: false                      # 已禁用（2026-07-24）：PE分位计算有bug，31行业全部0%，评分实际只依赖"近期跌越多分越高"。行业判断交还人工分析，写入 output/research/ 个股分析中
  # 健康分权重（0-100，越高越有吸引力）
  score_weights:
    pe_percentile: 0.50              # PE估值分位（越低分越高）
    recent_performance: 0.30         # 近期涨跌（跌多分高，均值回归逻辑）
    price_percentile: 0.20           # 价格历史分位（越低分越高）
  decline_threshold: 25              # 健康分<25 自动标记为衰退
  support_threshold: 70              # 健康分>70 自动标记为支撑
  pe_lookback_years: 5               # PE估值历史回看年数
  classification_ttl_days: 30        # 股票→行业映射缓存天数

# === 数据缓存 ===
cache:
  kline_ttl_days: 1             # 日K线缓存有效期（天）
  financials_ttl_days: 30       # 财务数据缓存有效期（天）
  market_ttl_days: 1            # 市场指标缓存有效期（天）
