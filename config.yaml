# 大A 虚拟盘交易系统 — 策略参数配置
# 修改阈值后无需改代码，重新运行 screener / monitor 即可生效

# === 账户 ===
account:
  initial_cash: 1000000         # 初始资金（100万）
  single_stock_max_pct: 0.20    # 单票仓位上限
  max_total_position_pct: 0.80  # 总仓位上限（极端行情）
  normal_total_position_pct: 0.50  # 正常总仓位上限

# === 深度价值策略（主力） ===
deep_value:
  min_market_cap: 50            # 最低市值（亿），筛掉壳股庄股
  min_deducted_roe: 0.06        # 扣非ROE最低（3年平均）
  min_cashflow_ratio: 0.8       # 经营现金流/净利润最低
  max_interest_debt_ratio: 0.30 # 有息负债率上限
  max_goodwill_ratio: 0.30      # 商誉/净资产上限
  max_pledge_ratio: 0.50        # 大股东质押率上限
  min_drawdown_52w: 0.40        # 距52周高点最小跌幅
  universe_top_n: 70             # 仅扫描沪深300前70大市值（回测拐点在80-100，70最优：+66.71%超额+48%）
  volume_shrink_days: 5         # 成交量萎缩连续天数
  volume_shrink_ratio: 0.50     # 成交量/20日均量上限
  pe_percentile_max: 0.20       # PE近5年分位上限（最低20%区间）
  commodity_cycle_check: true     # 商品周期检测：对有色/钢铁/煤炭/石油公司检测商品价格分位

  # 分批建仓
  batch_entry:
    - ratio: 0.30               # 第一批：到目标区间买30%
      drop: 0.00
    - ratio: 0.30               # 第二批：再跌10%加
      drop: 0.10
    - ratio: 0.40               # 第三批：企稳确认后加
      drop: 0.00

  hold_min_months: 6            # 最短持有期（月）
  hold_max_months: 18           # 最长持有期（月）

# === 极端恐慌策略 ===
panic:
  trigger_below_nav_pct: 0.12   # 全市场破净率触发阈值
  trigger_erp: 0.07             # 沪深300 ERP触发阈值
  etf_list:
    - "510300"                  # 沪深300ETF
    - "510500"                  # 中证500ETF
  batches: 5                    # 分5批买入
  batch_drop: 0.05              # 每跌5%加一批
  exit_erp: 0.04                # ERP回到4%以下退出

# === 止损规则 ===
stops:
  hard_stop: -0.20              # 硬止损：-20%（回测验证：-8%在低位反复割肉，-20%配合PE止盈50%策略有效）
  time_stop_months: 2           # 时间止损：持仓2个月无利润
  time_stop_cut_ratio: 0.50     # 时间止损砍仓比例
  fundamental_stop_revenue: -0.20  # 基本面止损：营收同比降20%
  fundamental_stop_profit: -0.20   # 基本面止损：利润同比降20%

# === 止盈规则 ===
take_profit:
  trail_trigger: 0.25           # 涨25%后启动移动止盈（回测最优15/25/30%，选25%）
  trail_drawdown: 0.12          # 最高点回撤12%离场（回测最优12-15%，8%太紧频繁甩下车）

# === 行业过滤（选股前自动筛选行业逻辑） ===
industry_filter:
